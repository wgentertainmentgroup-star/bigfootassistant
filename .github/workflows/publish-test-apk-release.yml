name: Publish Bigfoot's Day Test APK
# v0.12 release gate: web tests, complete first-customer Android journey, then APK packaging.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-test-apk-release.yml
      - android/app/build.gradle
      - android/app/src/main/**
      - android/app/src/androidTest/**
      - src/**
      - package.json
      - package-lock.json
      - capacitor.config.ts
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/publish-test-apk-release.yml
      - android/app/build.gradle
      - android/app/src/main/**
      - android/app/src/androidTest/**
      - src/**
      - package.json
      - package-lock.json
      - capacitor.config.ts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-android-runtime:
    name: Verify fresh install, setup, voice, and core journeys
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install and verify web application
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          npx cap sync android

      - name: Enable Android emulator acceleration
        run: |
          sudo usermod -a -G kvm $USER
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run full Android customer journey — first emulator
        id: android_e2e_first
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd android && { adb logcat -c; ./gradlew --no-daemon :app:connectedDebugAndroidTest || { test_status=$?; find app/build/outputs/androidTest-results/connected -type f -name "*.xml" -print -exec sed -n "1,240p" {} \;; timeout 8s adb logcat -d -v threadtime | grep -E "FATAL EXCEPTION|AndroidRuntime|bigfootsoftware|MainActivityRegressionTest|SpeechRecognizer|Permission" | tail -500 || true; exit "$test_status"; }; }

      - name: Retry complete customer journey on a fresh emulator
        if: steps.android_e2e_first.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd android && { adb logcat -c; ./gradlew --no-daemon :app:connectedDebugAndroidTest || { test_status=$?; find app/build/outputs/androidTest-results/connected -type f -name "*.xml" -print -exec sed -n "1,240p" {} \;; timeout 8s adb logcat -d -v threadtime | grep -E "FATAL EXCEPTION|AndroidRuntime|bigfootsoftware|MainActivityRegressionTest|SpeechRecognizer|Permission" | tail -500 || true; exit "$test_status"; }; }

  publish-apk:
    name: Build and publish permanent APK download
    if: github.event_name != 'pull_request'
    needs: verify-android-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Bigfoot's Day
        run: |
          npm test
          npm run build

      - name: Sync Android project
        run: npx cap sync android

      - name: Build sideloadable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Give APK a clear name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Bigfoots-Day-v0.12-Customer-Recovery.apk

      - name: Publish permanent public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.12-customer-recovery \
            Bigfoots-Day-v0.12-Customer-Recovery.apk \
            --target "$GITHUB_SHA" \
            --title "Bigfoot's Day v0.12 — Customer Recovery Build" \
            --notes "First-customer recovery release for Samsung Z Fold5. Voice is now a compact panel that leaves the app visible instead of covering it with a white or black screen. All five lessons have a clear action and Skip path; list and note practices return to Today and show the next lesson. This installs separately and forces setup to Step 1. Release requires the complete eleven-step setup, real Android microphone permission, voice panel visibility and cancel recovery, every lesson path, Camera/Video controls, core navigation, task/person/note creation, persistence after recreation, web regressions, and native lifecycle checks."
