name: Publish Bigfoot's Day Test APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-test-apk-release.yml
      - android/app/build.gradle
      - android/app/src/main/**
      - src/**
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    name: Build and publish permanent APK download
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Bigfoot's Day
        run: npm run build

      - name: Sync Android project
        run: npx cap sync android

      - name: Build sideloadable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Give APK a clear name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Bigfoots-Day-v0.6-Bubba-Voice-Test.apk

      - name: Publish permanent public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.6.0-bubba-voice-test \
            Bigfoots-Day-v0.6-Bubba-Voice-Test.apk \
            --target "$GITHUB_SHA" \
            --title "Bigfoot's Day v0.6 — Bubba Voice Repair" \
            --notes "Samsung Z Fold5 test APK. Uses native Android speech recognition and text-to-speech, includes a real setup voice test, changes Scout to Bubba, and teaches one capability at a time. Fresh test package ID avoids conflicts with earlier builds."
