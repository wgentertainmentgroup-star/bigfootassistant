name: Publish Bigfoot's Day Test APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-test-apk-release.yml
      - android/app/build.gradle
      - android/app/src/main/**
      - src/**
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    name: Build and publish permanent APK download
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Bigfoot's Day
        run: |
          npm test
          npm run build

      - name: Sync Android project
        run: npx cap sync android

      - name: Build sideloadable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Give APK a clear name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Bigfoots-Day-v0.7-In-App-Bubba-Voice.apk

      - name: Publish permanent public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.7.0-in-app-bubba-voice \
            Bigfoots-Day-v0.7-In-App-Bubba-Voice.apk \
            --target "$GITHUB_SHA" \
            --title "Bigfoot's Day v0.7 — In-App Bubba Voice" \
            --notes "Regression-tested Samsung Z Fold5 APK. Removes the external white speech screen, listens inside the animated Bubba HUD, uses native Android speech recognition and text-to-speech, and preserves the guided senior-friendly setup. Fresh v0.7 package identity avoids conflicts with earlier builds."
