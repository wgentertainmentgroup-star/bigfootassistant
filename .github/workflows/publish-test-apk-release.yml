name: Publish Bigfoot's Day Test APK
# v0.20 custom-name gate: the chosen assistant identity must follow the customer everywhere.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-test-apk-release.yml
      - android/app/build.gradle
      - android/app/src/main/**
      - android/app/src/androidTest/**
      - src/**
      - package.json
      - package-lock.json
      - capacitor.config.ts
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/publish-test-apk-release.yml
      - android/app/build.gradle
      - android/app/src/main/**
      - android/app/src/androidTest/**
      - src/**
      - package.json
      - package-lock.json
      - capacitor.config.ts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-android-runtime:
    name: Verify fresh install, setup, voice, and core journeys
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install and verify web application
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          npx cap sync android

      - name: Enable Android emulator acceleration
        run: |
          sudo usermod -a -G kvm $USER
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run full Android customer journey — first emulator
        id: android_e2e_first
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd android && { adb logcat -c; ./gradlew --no-daemon :app:connectedDebugAndroidTest || { test_status=$?; find app/build/outputs/androidTest-results/connected -type f -name "*.xml" -print -exec sed -n "1,240p" {} \;; timeout 8s adb logcat -d -v threadtime | grep -E "FATAL EXCEPTION|AndroidRuntime|bigfootsoftware|MainActivityRegressionTest|SpeechRecognizer|Permission" | tail -500 || true; exit "$test_status"; }; }

      - name: Retry complete customer journey on a fresh emulator
        if: steps.android_e2e_first.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd android && { adb logcat -c; ./gradlew --no-daemon :app:connectedDebugAndroidTest || { test_status=$?; find app/build/outputs/androidTest-results/connected -type f -name "*.xml" -print -exec sed -n "1,240p" {} \;; timeout 8s adb logcat -d -v threadtime | grep -E "FATAL EXCEPTION|AndroidRuntime|bigfootsoftware|MainActivityRegressionTest|SpeechRecognizer|Permission" | tail -500 || true; exit "$test_status"; }; }

  publish-apk:
    name: Build and publish permanent APK download
    if: github.event_name != 'pull_request'
    needs: verify-android-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Bigfoot's Day
        run: |
          npm test
          npm run build

      - name: Sync Android project
        run: npx cap sync android

      - name: Build sideloadable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Give APK a clear name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Bigfoots-Day-v0.20-Custom-Name.apk

      - name: Publish permanent public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.20-custom-name \
            Bigfoots-Day-v0.20-Custom-Name.apk \
            --target "$GITHUB_SHA" \
            --title "Bigfoot's Day v0.20 — Custom Assistant Name" \
            --notes "Samsung Z Fold5 test build for older customers. Setup and Settings now let the customer choose any short assistant name. That saved name is used throughout navigation, dashboard status, starter lessons, voice controls, the native Stop and Return safety panel, timer labels, notes, email suggestions, Google help, live voice, and cloud assistant instructions. A full new-customer Android test names the assistant Walter, confirms the old Bubba dashboard label is gone, restarts the app, and verifies Walter remains active. All v0.19 phone tasks, Calendar, phonebook, permissions, Google choice, voice recovery, Home icon, and senior-friendly navigation remain included. Installs separately as Bigfoot v0.20 Custom Name."
