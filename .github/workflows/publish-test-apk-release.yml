name: Publish Bigfoot's Day Test APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-test-apk-release.yml
      - android/app/build.gradle
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    name: Build and publish permanent APK download
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Bigfoot's Day
        run: npm run build

      - name: Sync Android project
        run: npx cap sync android

      - name: Build sideloadable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Give APK a clear name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Bigfoots-Day-v0.5-Samsung-Test.apk

      - name: Publish permanent public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.5.0-samsung-test \
            Bigfoots-Day-v0.5-Samsung-Test.apk \
            --target "$GITHUB_SHA" \
            --title "Bigfoot's Day v0.5 Samsung Test" \
            --notes "Sideloadable test APK for Samsung Z Fold5. This build uses a fresh test package ID to avoid conflicts with earlier test installations."
