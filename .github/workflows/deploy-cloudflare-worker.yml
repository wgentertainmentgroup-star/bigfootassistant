name: Deploy Private Cloudflare Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - cloudflare/**
      - server/personality.mjs
      - wrangler.toml
      - .github/workflows/deploy-cloudflare-worker.yml

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Bigfoot's Day private service
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Deploy Cloudflare Worker
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            OPENAI_API_KEY
            BIGFOOT_APP_TOKEN
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BIGFOOT_APP_TOKEN: ${{ secrets.BIGFOOT_APP_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Record deployment address
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: echo "Bigfoot's Day service deployed to ${DEPLOYMENT_URL}" >> "$GITHUB_STEP_SUMMARY"
